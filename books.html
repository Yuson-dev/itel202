<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books | Library Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-protected>

<header>
    <h2>Library Management System</h2>
    <p>Online Appointment and Queue Management System</p>
</header>

<nav id="main-nav"></nav>

<main>
    <section class="page" id="books">

        <h2>Book Search and Availability</h2>

        <h3>Filter Options</h3>

        <div class="card-container">
            <div>
                <label>Search by Title</label>
                <input type="text" id="book-title" placeholder="Book title">
            </div>
            <div>
                <label>Search by Author</label>
                <input type="text" id="book-author" placeholder="Author name">
            </div>
            <div>
                <label>Category</label>
                <select id="book-category">
                    <option>All Categories</option>
                    <option>Science</option>
                    <option>Mathematics</option>
                    <option>History</option>
                    <option>Technology</option>
                    <option>Literature</option>
                </select>
            </div>
        </div>

        <button id="btn-search-books">Search Books</button>

        <h3>Book List</h3>

        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Availability</th>
                </tr>
            </thead>
            <tbody id="book-table-body">
                <tr><td colspan="5" class="muted">Loading books...</td></tr>
            </tbody>
        </table>

    </section>
</main>

<footer>
    <p>Library Appointment and Queue Management System</p>
    <p>© 2026 Library Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
const bookTableBody = document.getElementById("book-table-body");

async function loadBooks() {
    if (typeof SUPABASE_READY === 'undefined' || !SUPABASE_READY || !supabaseClient) {
        bookTableBody.innerHTML = '<tr><td colspan="5" style="color:red;">Database not connected.</td></tr>';
        return;
    }

    const { data: books, error } = await supabaseClient
        .from('books')
        .select('*')
        .order('id', { ascending: true });

    if (error) {
        bookTableBody.innerHTML = `<tr><td colspan="5" style="color:red;">Error: ${error.message}</td></tr>`;
        return;
    }

    renderBooks(books);
}

async function filterBooks() {
    const title = document.getElementById("book-title").value.trim().toLowerCase();
    const author = document.getElementById("book-author").value.trim().toLowerCase();
    const category = document.getElementById("book-category").value;

    let query = supabaseClient.from('books').select('*');

    if (title) query = query.ilike('title', `%${title}%`);
    if (author) query = query.ilike('author', `%${author}%`);
    if (category !== "All Categories") query = query.eq('category', category);

    const { data, error } = await query.order('id', { ascending: true });

    if (error) {
        bookTableBody.innerHTML = `<tr><td colspan="5" style="color:red;">Error: ${error.message}</td></tr>`;
    } else {
        renderBooks(data);
    }
}

function renderBooks(list) {
    bookTableBody.innerHTML = "";

    if (!list || list.length === 0) {
        bookTableBody.innerHTML = '<tr><td colspan="5" class="muted">No books matched your search.</td></tr>';
        return;
    }

    list.forEach(function (book) {
        const row = document.createElement("tr");
        const statusColor = book.available ? 'color: green;' : 'color: #d9534f;';
        
        row.innerHTML =
            "<td>" + escapeHtml(book.id) + "</td>" +
            "<td>" + escapeHtml(book.title) + "</td>" +
            "<td>" + escapeHtml(book.author) + "</td>" +
            "<td>" + escapeHtml(book.category) + "</td>" +
            '<td><span class="status" style="' + statusColor + '">' +
                (book.available ? "Available" : "Borrowed") +
            "</span></td>";
        bookTableBody.appendChild(row);
    });
}

document.getElementById("btn-search-books").addEventListener("click", filterBooks);
document.addEventListener("DOMContentLoaded", loadBooks);
</script>
</body>
</html>
