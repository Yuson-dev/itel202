<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | Library Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-protected>

<header>
    <h2>Library Management System</h2>
    <p>Online Appointment and Queue Management System</p>
</header>

<nav id="main-nav"></nav>

<main>
    <section class="page" id="reports">

        <h2>Record Management and Reports</h2>

        <h3>Report Filters</h3>

        <div class="card-container">
            <div>
                <label>Report Type</label>
                <select id="report-type">
                    <option value="borrowings">Borrowed Books</option>
                    <option value="appointments">Appointments</option>
                    <option value="users">Registered Users</option>
                </select>
            </div>

            <div>
                <label>Start Date</label>
                <input type="date" id="report-start">
            </div>

            <div>
                <label>End Date</label>
                <input type="date" id="report-end">
            </div>
        </div>

        <button id="btn-generate">Generate Report</button>

        <h3>Report Data</h3>

        <table>
            <thead id="report-thead">
                <!-- Headers will be injected by JS -->
            </thead>
            <tbody id="report-table-body">
                <tr><td colspan="5" class="muted">Select a report type and click Generate.</td></tr>
            </tbody>
        </table>

    </section>
</main>

<footer>
    <p>Library Appointment and Queue Management System</p>
    <p>© 2026 Library Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
document.getElementById("btn-generate").addEventListener("click", async function() {
    const type = document.getElementById("report-type").value;
    const start = document.getElementById("report-start").value;
    const end = document.getElementById("report-end").value;
    
    const thead = document.getElementById("report-thead");
    const tbody = document.getElementById("report-table-body");
    
    tbody.innerHTML = '<tr><td colspan="5" class="muted">Loading data...</td></tr>';
    thead.innerHTML = "";

    if (typeof SUPABASE_READY === 'undefined' || !SUPABASE_READY || !supabaseClient) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:red;">Database not connected.</td></tr>';
        return;
    }

    let query = supabaseClient.from(type).select('*');

    if (type === 'borrowings' && start && end) {
        query = query.gte('borrow_date', start).lte('borrow_date', end);
    } else if (type === 'appointments' && start && end) {
        query = query.gte('date', start).lte('date', end);
    }

    const { data, error } = await query.order('created_at', { ascending: false });

    if (error) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:red;">Error: ${error.message}</td></tr>`;
        return;
    }

    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted">No records found for this timeframe.</td></tr>';
        return;
    }

    if (type === 'borrowings') {
        thead.innerHTML = '<tr><th>Book ID</th><th>Book Title</th><th>Student</th><th>Borrow Date</th><th>Status</th></tr>';
        data.forEach(r => {
            tbody.innerHTML += `<tr>
                <td>${escapeHtml(r.book_id)}</td>
                <td>${escapeHtml(r.book_title)}</td>
                <td>${escapeHtml(r.student_name)}</td>
                <td>${formatDate(r.borrow_date)}</td>
                <td>${escapeHtml(r.status)}</td>
            </tr>`;
        });
    } else if (type === 'appointments') {
        thead.innerHTML = '<tr><th>Student</th><th>Date</th><th>Time</th><th>Purpose</th><th>Status</th></tr>';
        data.forEach(r => {
            tbody.innerHTML += `<tr>
                <td>${escapeHtml(r.student_name || r.studentId || 'N/A')}</td>
                <td>${formatDate(r.date)}</td>
                <td>${escapeHtml(r.time)}</td>
                <td>${escapeHtml(r.purpose)}</td>
                <td>${escapeHtml(r.status)}</td>
            </tr>`;
        });
    } else if (type === 'users') {
        thead.innerHTML = '<tr><th>Student ID</th><th>Full Name</th><th>Username</th><th>Role</th><th>Status</th></tr>';
        data.forEach(r => {
            tbody.innerHTML += `<tr>
                <td>${escapeHtml(r.student_id)}</td>
                <td>${escapeHtml(r.full_name)}</td>
                <td>${escapeHtml(r.username)}</td>
                <td style="text-transform: capitalize;">${escapeHtml(r.role)}</td>
                <td>Active</td>
            </tr>`;
        });
    }
});
</script>
</body>
</html>
