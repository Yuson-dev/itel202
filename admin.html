<script>
document.addEventListener("DOMContentLoaded", async function () {
    if (typeof SUPABASE_READY === 'undefined' || !SUPABASE_READY || !supabaseClient) return;

    const settingsMessage = document.getElementById("settings-message");

    // --- 1. LOAD USERS ---
    const { data: users, error } = await supabaseClient.from('users').select('*').order('role', { ascending: true });

    if (!error && users) {
        document.getElementById("stat-total-users").textContent = users.length;
        document.getElementById("stat-librarians").textContent = users.filter(u => u.role === "librarian").length;
        document.getElementById("stat-admins").textContent = users.filter(u => u.role === "admin").length;

        const tbody = document.getElementById("admin-user-table-body");
        tbody.innerHTML = "";

        users.forEach(user => {
            let roleColor = "black";
            if (user.role === "admin") roleColor = "#d9534f";
            if (user.role === "librarian") roleColor = "#f0ad4e";

            tbody.innerHTML += `<tr>
                <td>${user.student_id || 'N/A'}</td>
                <td>${escapeHtml(user.full_name || 'N/A')}</td>
                <td>${escapeHtml(user.username)}</td>
                <td style="text-transform: capitalize; color: ${roleColor}; font-weight: bold;">${user.role || 'student'}</td>
                <td><span style="color: green; font-weight: bold;">Active</span></td>
            </tr>`;
        });
    }

    // --- 2. LOAD SETTINGS (Key-Value style) ---
    const { data: settingsData } = await supabaseClient.from('settings').select('*');
    
    // Convert the array of rows into a single object for easy access
    const settings = {};
    if (settingsData) {
        settingsData.forEach(row => {
            settings[row.key] = row.value;
        });
    }

    // Populate the inputs
    document.getElementById("setting-hours").value = settings.operating_hours || "";
    document.getElementById("setting-capacity").value = settings.max_capacity || "";
    document.getElementById("setting-name").value = settings.system_name || "";
    
    // Update the header dynamically
    document.getElementById("header-system-name").textContent = settings.system_name || "Library Management System";

    // --- 3. SAVE SETTINGS ---
    document.getElementById("btn-save-settings").addEventListener("click", async function() {
        const hours = document.getElementById("setting-hours").value.trim();
        const capacity = document.getElementById("setting-capacity").value;
        const name = document.getElementById("setting-name").value.trim();

        if (!hours || !capacity || !name) {
            settingsMessage.textContent = "Please fill out all fields.";
            settingsMessage.className = "message error";
            return;
        }

        // We update each row individually based on the 'key'
        const updates = [
            supabaseClient.from('settings').update({ value: hours }).eq('key', 'operating_hours'),
            supabaseClient.from('settings').update({ value: capacity }).eq('key', 'max_capacity'),
            supabaseClient.from('settings').update({ value: name }).eq('key', 'system_name')
        ];

        const results = await Promise.all(updates);
        const error = results.find(r => r.error)?.error;

        if (error) {
            settingsMessage.textContent = "Error saving: " + error.message;
            settingsMessage.className = "message error";
        } else {
            settingsMessage.textContent = "Settings saved successfully!";
            settingsMessage.className = "message success";
            
            document.getElementById("header-system-name").textContent = name;
            setTimeout(() => { settingsMessage.classList.add("hidden"); }, 3000);
        }
    });
});
</script>
