<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Library Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-protected>

<header>
    <h2>Library Management System</h2>
    <p>Online Appointment and Queue Management System</p>
</header>

<nav id="main-nav"></nav>

<main>
    <section class="page" id="notifications">

        <h2>Notifications and Reminders</h2>
        <h3>Your Notification Center</h3>

        <div id="notification-list">
            <p class="muted">Loading notifications...</p>
        </div>

    </section>
</main>

<footer>
    <p>Library Appointment and Queue Management System</p>
    <p>© 2026 Library Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function () {
    const user = getCurrentUser();
    const listContainer = document.getElementById("notification-list");

    if (!user) return;

    if (typeof SUPABASE_READY === 'undefined' || !SUPABASE_READY || !supabaseClient) {
        listContainer.innerHTML = '<p style="color:red;">Database not connected.</p>';
        return;
    }

    // Fetch notifications for this student
    const { data: notifications, error } = await supabaseClient
        .from('notifications')
        .select('*')
        .eq('student_id', user.student_id)
        .order('created_at', { ascending: false });

    if (error) {
        listContainer.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
        return;
    }

    if (notifications.length === 0) {
        listContainer.innerHTML = '<div class="placeholder"><p>You have no new notifications.</p></div>';
        return;
    }

    listContainer.innerHTML = "";

    notifications.forEach(function (notif) {
        const div = document.createElement("div");
        div.className = "placeholder";
        
        const dateStr = new Date(notif.created_at).toLocaleDateString("en-US", { 
            month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" 
        });

        div.innerHTML = `
            <h3>${escapeHtml(notif.title)}</h3>
            <p>${escapeHtml(notif.message)}</p>
            <small class="muted">${dateStr}</small>
        `;
        listContainer.appendChild(div);
    });

    // Mark all notifications as read so the red badge goes away
    await supabaseClient
        .from('notifications')
        .update({ is_read: true })
        .eq('student_id', user.student_id)
        .eq('is_read', false);

});
</script>
</body>
</html>
