<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Library Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Library Management System</h2>
    <p>Online Appointment and Queue Management System</p>
</header>

<main>
    <section class="page" id="login">
        <div class="login-container">
            <h2 id="auth-title">Library System Login</h2>
            <p id="auth-message" style="text-align:center;"></p>

            <label>Username</label>
            <input type="text" id="auth-username" placeholder="Enter username">

            <label>Password</label>
            <input type="password" id="auth-password" placeholder="Enter password">

            <button id="btn-login">Login</button>
        </div>
    </section>
</main>

<footer>
    <p>Library Appointment and Queue Management System</p>
    <p>© 2026 Library Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="login.js"></script>
</body>
</html>
